<script>
// 간단한 토스트 알림 - 확인이 필요 없는 단순 안내/성공/오류 메시지에 alert() 대신 사용
// (삭제 등 사용자의 '결정'이 필요한 경우는 여전히 confirm()을 사용)
function showToast(message, type){
  type = type || 'info';
  const colors = { info:'#2563eb', success:'#16a34a', error:'#dc2626', warn:'#ca8a04' };
  const el = document.createElement('div');
  el.textContent = message;
  el.style.cssText = `position:fixed;left:50%;bottom:110px;transform:translateX(-50%);`+
    `background:${colors[type]||colors.info};color:#fff;padding:10px 16px;`+
    `border-radius:9999px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.18);`+
    `z-index:99999;max-width:88%;text-align:center;opacity:0;transition:opacity .2s ease;`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity='1'; });
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),250); },2200);
}

let currentLat='';
let currentLng='';
let currentAcc='';
const DEPTH_KEY='depth_records_v35';

function loadRecords(){
  return JSON.parse(localStorage.getItem(DEPTH_KEY)||'[]');
}
function saveRecords(arr){
  localStorage.setItem(DEPTH_KEY,JSON.stringify(arr));
}
function refreshStats(){
  const arr=loadRecords();
  const nums=arr.map(x=>Number(x.depth)).filter(x=>!isNaN(x));
  const ps=document.querySelectorAll('p');
  if(nums.length){
    const avg=(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2);
    const max=Math.max(...nums).toFixed(2);
    const min=Math.min(...nums).toFixed(2);
    ps.forEach(p=>{
      if(p.textContent.includes('총 건수')) p.nextElementSibling.innerHTML=`${nums.length} <span class="text-xs">건</span>`;
      if(p.textContent.includes('평균 심도')) p.nextElementSibling.innerHTML=`${avg}<span class="text-xs">m</span>`;
      if(p.textContent.includes('최대/최소')) p.nextElementSibling.textContent=`${max} / ${min}`;
    });
  }
  const sec=[...document.querySelectorAll('section')].find(s=>s.textContent.includes('최근 저장 이력'));
  if(sec){
    sec.querySelectorAll('.record-item').forEach(e=>e.remove());
    arr.slice().reverse().forEach((r,i)=>{
      const d=document.createElement('div');
      d.className='record-item bg-white p-3 rounded-xl shadow-sm border border-gray-200 mt-2';
      d.innerHTML=`
<div class="flex items-start gap-3">
<input type="checkbox" class="w-5 h-5 mt-1">
<div class="flex-1">
  <div class="flex items-center gap-2 mb-1">
    <span class="text-xs bg-gray-100 text-gray-700 font-bold px-2 py-1 rounded">No.${arr.length-i}</span>
    <span class="text-xs text-gray-500">${r.time}</span>
    ${r.accuracy?`<span class="text-xs font-semibold" style="color:${Number(r.accuracy)<=3?'#16a34a':Number(r.accuracy)<=5?'#2563eb':'#ca8a04'}">±${r.accuracy}m</span>`:''}
  </div>
  <div class="text-sm font-medium text-gray-800">${r.manageNo ? '['+r.manageNo+'] ' : ''}${r.address||'주소 없음'}</div>
</div>
<div class="text-right whitespace-nowrap">
  <span class="text-3xl font-black text-gray-900">${Number(r.depth).toFixed(2)}</span><span class="text-base font-bold"> m</span>
</div>
</div>`;
      sec.insertBefore(d,sec.querySelector('.grid'));
    const lastSaved=document.getElementById('lastSavedTime');
    if(lastSaved){
      if(arr.length){
        const dateOnly=arr[arr.length-1].time.split('오전')[0].split('오후')[0].trim();
        lastSaved.textContent='최근 저장 : '+dateOnly;
      }else{
        lastSaved.textContent='';
      }
    }

    });
  }
}
document.addEventListener('DOMContentLoaded',()=>{

 const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('심도 데이터 저장'));
 const input=document.getElementById('depth');
 if(btn&&input){
   // GPS 좌표를 확보하기 전에는 저장할 수 없도록 기본 비활성화 상태로 시작
   // (updateGpsStatus()에서 GPS 측위 성공 시 자동으로 다시 활성화됨)
   btn.disabled=true;
   btn.style.opacity='0.6';

   btn.addEventListener('click',()=>{
     if(btn.disabled) return; // 중복 클릭 방지

     if(!currentAcc){
       showToast('먼저 GPS 위치를 측정해주세요.','error');
       return;
     }
     if(gpsLimit() && Number(currentAcc)>gpsLimit()){
       showToast(`정확도(±${currentAcc}m)가 기준(${gpsLimit()}m)을 넘습니다. 재측정해주세요.`,'error');
       return;
     }

     const v=parseFloat(input.value);
     if(isNaN(v)){ showToast('심도를 입력하세요.','error'); return; }
     if(v<0){ showToast('심도는 0 이상의 값이어야 합니다.','error'); return; }
     if(v>50){
       if(!confirm(`입력하신 심도(${v}m)가 비정상적으로 큰 값입니다. 계속 저장하시겠습니까?`)) return;
     }

     const manageNo=document.getElementById('manageNo')?.value?.trim()||'';
     if(!manageNo){
       if(!confirm('관리번호가 입력되지 않았습니다. 관리번호 없이 저장하시겠습니까?')) return;
     }

     btn.disabled=true;
     const arr=loadRecords();
     const addr=(document.getElementById('roadAddr')?.textContent||document.getElementById('jibunAddr')?.textContent||'');
     const now=new Date();
     const time=`${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')}. ${now.getHours()<12?'오전':'오후'} ${String((now.getHours()%12)||12).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
     arr.push({manageNo,depth:v,time:time,address:addr,latitude:currentLat,longitude:currentLng,accuracy:currentAcc,samples:currentSamples});
     saveRecords(arr);
     refreshStats();
     showToast('저장되었습니다.','success');
     input.value='';
     // 저장 후 좌표 초기화 → 다음 지점에서 반드시 새로 측정
     resetGpsFix();
   });
 }
 refreshStats();
});
</script>




<script>
document.addEventListener('DOMContentLoaded',()=>{
  const KEY='depth_user_name';
  const nameSpan=document.getElementById('userNameDisplay');
  const btn=document.getElementById('changeUserBtn');
  function load(){
    const n=localStorage.getItem(KEY)||'김태호';
    nameSpan.textContent=n;
  }
  load();
  btn.addEventListener('click',()=>{
    const current=localStorage.getItem(KEY)||'김태호';
    const v=prompt('사용자명을 입력하세요.',current);
    if(v && v.trim()){
      localStorage.setItem(KEY,v.trim());
      load();
    }
  });
});
</script><script>

document.addEventListener('DOMContentLoaded',()=>{
  const sec=[...document.querySelectorAll('section')].find(s=>s.textContent.includes('최근 저장 이력'));
  if(!sec) return;
  const buttons=sec.querySelectorAll('.grid button');
  if(buttons.length<2) return;
  const selBtn=buttons[0], allBtn=buttons[1];

  function redraw(){ refreshStats(); }

  selBtn.addEventListener('click',()=>{
    let arr=loadRecords();
    if(arr.length===0){ showToast('삭제할 데이터가 없습니다.','warn'); return; }
    // 이력 카드(.record-item) 내부 체크박스만 정확히 선택 (다른 영역 체크박스와 인덱스 혼선 방지)
    const checks=[...sec.querySelectorAll('.record-item input[type=checkbox]')];
    const checkedCount=checks.filter(c=>c.checked).length;
    if(checkedCount===0){ showToast('선택된 항목이 없습니다.','warn'); return; }
    if(!confirm(`선택한 ${checkedCount}건을 삭제하시겠습니까?`)) return;
    const rev=arr.slice().reverse();
    const kept=[];
    rev.forEach((r,i)=>{
      if(!(checks[i] && checks[i].checked)) kept.push(r);
    });
    saveRecords(kept.reverse());
    redraw();
    showToast('선택한 항목을 삭제했습니다.','success');
  });

  allBtn.addEventListener('click',()=>{
    if(!confirm('모든 데이터를 삭제하시겠습니까?')) return;
    localStorage.removeItem(DEPTH_KEY);
    redraw();
    showToast('전체 삭제되었습니다.','success');
  });
});

</script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
 const backupBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('데이터 백업'));
 const restoreBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('데이터 복원'));
 if(!backupBtn||!restoreBtn) return;

 backupBtn.onclick=()=>{
   const data={
     version:'V0.0',
     user:localStorage.getItem('depth_user_name')||'',
     records:JSON.parse(localStorage.getItem('depth_records_v35')||'[]')
   };
   const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
   const a=document.createElement('a');
   a.href=URL.createObjectURL(blob);
   const d=new Date();
   const f=`심도측정_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}.json`;
   a.download=f;
   a.click();
   URL.revokeObjectURL(a.href);
 };

 const input=document.createElement('input');
 input.type='file';
 input.accept='.json';
 input.style.display='none';
 document.body.appendChild(input);

 restoreBtn.onclick=()=>input.click();

 input.onchange=(e)=>{
   const file=e.target.files[0];
   if(!file) return;
   const fr=new FileReader();
   fr.onload=()=>{
     try{
       const obj=JSON.parse(fr.result);
       if(!obj.records || !Array.isArray(obj.records)) throw new Error('invalid backup format');

       // 항목별로 최소 형식(심도가 숫자로 변환 가능한지)을 검증해 손상된 레코드가
       // 이후 통계/리스트 렌더링에서 오류를 일으키지 않도록 함
       const validRecords = obj.records.filter(r => r && typeof r==='object' && !isNaN(parseFloat(r.depth)));
       const skipped = obj.records.length - validRecords.length;

       if(validRecords.length===0){
         showToast('복원할 유효한 데이터가 없습니다.','error');
         return;
       }

       const confirmMsg = skipped>0
         ? `기존 데이터를 복원 데이터(${validRecords.length}건, 형식 오류 ${skipped}건 제외)로 덮어쓰시겠습니까?`
         : `기존 데이터를 복원 데이터(${validRecords.length}건)로 덮어쓰시겠습니까?`;
       if(!confirm(confirmMsg)) return;

       localStorage.setItem('depth_records_v35',JSON.stringify(validRecords));
       if(obj.user) localStorage.setItem('depth_user_name',obj.user);
       showToast('복원이 완료되었습니다. 화면을 새로고침합니다.','success');
       setTimeout(()=>location.reload(),600);
     }catch{
       showToast('올바른 백업 파일이 아닙니다.','error');
     }
   };
   fr.readAsText(file);
 };
});
</script>

<script>
/*
 * ⚠️ 보안 주의: 아래 카카오 REST API 키는 클라이언트(브라우저) 코드에 그대로 노출되어
 * 누구나 페이지 소스에서 확인/도용할 수 있는 상태입니다. 근본적인 해결을 위해서는:
 *   1) 카카오 개발자 콘솔에서 이 키를 재발급(폐기)하고,
 *   2) 재발급한 키에 '플랫폼 > Web' 도메인 제한(허용 도메인만 등록)을 설정하세요.
 * 코드 구조상 키를 여기 상수 하나로만 관리하도록 분리해두었으니, 재발급 후에는
 * 아래 KAKAO_API_KEY 값만 교체하면 됩니다. (완전한 보안 조치는 서버를 경유하는
 * 프록시 구성이며, 정적 페이지 구조상 최선의 완화책은 도메인 제한입니다.)
 */
const KAKAO_API_KEY = 'eaa5300f4046bfac8ce0355b1bd8cd88';

async function reverseGeocode(lat,lng){
 const road=document.getElementById('roadAddr');
 const jibun=document.getElementById('jibunAddr');
 const gps=document.getElementById('gpsCoord');

 gps.textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
 road.textContent='주소 조회 중...';
 jibun.textContent='주소 조회 중...';

 try{
   const controller=new AbortController();
   const timeoutId=setTimeout(()=>controller.abort(),8000);

   const response=await fetch(
    `https://dapi.kakao.com/v2/local/geo/coord2address.json?x=${lng}&y=${lat}&input_coord=WGS84`,
    {
      headers:{
        Authorization:`KakaoAK ${KAKAO_API_KEY}`
      },
      signal:controller.signal
    }
   );
   clearTimeout(timeoutId);

   if(!response.ok){
     // API 키/도메인 제한(401,403), 쿼터 초과(429), 잘못된 요청(400) 등 실제 API 오류
     if(response.status===401 || response.status===403){
       road.textContent='주소 조회 실패 (API 인증 오류)';
       jibun.textContent='카카오 API 키/도메인 설정을 확인하세요';
     }else if(response.status===429){
       road.textContent='주소 조회 실패 (요청 한도 초과)';
       jibun.textContent='잠시 후 다시 시도해주세요';
     }else{
       road.textContent=`주소 조회 실패 (오류 코드 ${response.status})`;
       jibun.textContent='잠시 후 다시 시도해주세요';
     }
     return;
   }

   const data=await response.json();

   if(data.documents && data.documents.length){
      const doc=data.documents[0];
      // 도로명 주소가 없는 지점(도로명 미부여 구역 등)과 지번 주소를 명확히 구분
      road.textContent = doc.road_address?.address_name || '도로명 없음 (미부여 지역)';
      jibun.textContent = doc.address?.address_name || '지번 주소 없음';
   }else{
      // API 응답은 정상이지만 좌표에 매칭되는 주소가 실제로 없는 경우(바다, 행정구역 밖 등)
      road.textContent='해당 좌표에 등록된 주소 없음';
      jibun.textContent='해당 좌표에 등록된 주소 없음';
   }
 }catch(e){
   // 네트워크 단절, 타임아웃(8초) 등 요청 자체가 실패한 경우
   if(e.name==='AbortError'){
     road.textContent='주소 조회 시간 초과';
     jibun.textContent='네트워크 상태를 확인 후 다시 시도해주세요';
   }else{
     road.textContent='주소 조회 실패 (네트워크 오류)';
     jibun.textContent='인터넷 연결을 확인해주세요';
   }
 }
}
</script>


<script>
/*
 * GPS 정밀 측위 로직 (V0.0)
 * 1) 예열: 앱이 열려 있는 동안 GPS를 계속 수신해 최근 샘플을 버퍼에 보관
 *    → 측정 버튼을 누르면 이미 쌓인 샘플을 활용해 보통 1~3초 안에 확정
 * 2) 평균: 이동 중 샘플·튐값 제거 후 정확도 가중평균
 * 3) 정확도 기준: 기준(기본 5m)을 넘으면 저장 버튼 비활성화
 * 4) 정확도·샘플수를 기록에 함께 저장(엑셀 컬럼 포함)
 */
const GPS_MODE_KEY='AUTO_GPS_MODE';
const GPS_LIMIT_KEY='GPS_ACC_LIMIT';
const GPS_MAX_MS=8000;        // 최대 대기 시간
const GPS_MIN_MS=1500;        // 최소 대기 시간 (누른 직후 순간값만으로 확정 방지)
const GPS_WINDOW_MS=4000;     // 버튼 누르기 전 몇 초까지의 예열 샘플을 쓸지
const GPS_BUFFER_MS=15000;    // 버퍼 보관 시간
const GPS_MIN_SAMPLES=3;
const GPS_MOVING_SPEED=1.2;   // m/s 이상이면 걷는 중으로 보고 제외
let gpsLiveId=null, gpsBuffer=[], gpsMeasuring=false, gpsMeasureStart=0, gpsMeasureTimer=null, gpsTickTimer=null;
let currentSamples=0;

function gpsLimit(){
 const v=localStorage.getItem(GPS_LIMIT_KEY);
 return v===null?5:Number(v); // 0 = 제한 없음
}

function loadGpsMode(){
 const chk=document.getElementById('autoGpsMode');
 const txt=document.getElementById('gpsModeText');
 const mode=localStorage.getItem(GPS_MODE_KEY)==='true';
 if(chk){
   chk.checked=mode;
   txt.textContent=mode?'ON':'OFF';
   chk.onchange=()=>{
     localStorage.setItem(GPS_MODE_KEY,chk.checked);
     txt.textContent=chk.checked?'ON':'OFF';
   };
   // 체크박스를 눌렀을 때 버튼 클릭(측정 시작)으로 번지지 않도록
   chk.addEventListener('click',e=>e.stopPropagation());
 }
 const sel=document.getElementById('gpsLimit');
 if(sel){
   sel.value=String(gpsLimit());
   sel.onchange=()=>{ localStorage.setItem(GPS_LIMIT_KEY,sel.value); updateGpsStatus(); };
 }
}

function accColor(acc){
 const lim=gpsLimit();
 if(lim && acc>lim) return '#dc2626';
 if(acc<=3) return '#16a34a';
 if(acc<=5) return '#2563eb';
 return '#ca8a04';
}

function setSaveEnabled(on,label,bg){
 const b=document.getElementById('saveBtn');
 if(!b) return;
 b.disabled=!on;
 b.style.opacity=on?'1':'0.6';
 b.style.background=bg||(on?'#2563eb':'#94a3b8');
 b.innerHTML=label||'<i class="fa-solid fa-cloud-arrow-up text-lg"></i> 심도 데이터 저장하기';
}

// 확정된 측정 결과 표시 + 기준 판정
function updateGpsStatus(){
 const s=document.getElementById('gpsStatus');
 if(!s||!currentAcc) return;
 const lim=gpsLimit();
 const acc=Number(currentAcc);
 if(lim && acc>lim){
   s.innerHTML=`정확도 미달 ±${acc}m (기준 ${lim}m) — 위치 버튼을 눌러 재측정하세요`;
   s.style.color='#dc2626';
   setSaveEnabled(false,'<i class="fa-solid fa-ban text-lg"></i> 정확도 미달 · 재측정 필요');
 }else{
   s.innerHTML=`측정 완료 ±${acc}m <span style="font-weight:500;color:#64748b">(샘플 ${currentSamples}개)</span>`;
   s.style.color=accColor(acc);
   setSaveEnabled(true);
 }
}

// 측정 전 실시간(예열) 상태 표시
function showLiveStatus(){
 if(gpsMeasuring||currentAcc) return;
 const s=document.getElementById('gpsStatus');
 if(!s) return;
 const last=gpsBuffer[gpsBuffer.length-1];
 if(!last){ s.textContent='GPS 신호 찾는 중...'; s.style.color='#64748b'; return; }
 const acc=Math.round(last.accuracy*10)/10;
 s.innerHTML=`실시간 ±${acc}m · 측정 지점에서 위치 버튼을 누르세요`;
 s.style.color=accColor(acc);
}

function gpsDistanceMeters(lat1,lng1,lat2,lng2){
 const R=6371000, toRad=d=>d*Math.PI/180;
 const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 튐값 제거 후 가중평균. 정확도는 '평균 효과'를 과장하지 않도록 보수적으로 추정
function computeWeightedPosition(samples){
 if(!samples.length) return null;
 const best=Math.min(...samples.map(s=>s.accuracy));
 // 정확도가 가장 좋은 샘플보다 크게 나쁜 샘플은 제외
 let pool=samples.filter(s=>s.accuracy<=Math.max(best*2,best+3));
 const lats=pool.map(s=>s.lat).sort((a,b)=>a-b);
 const lngs=pool.map(s=>s.lng).sort((a,b)=>a-b);
 const medLat=lats[Math.floor(lats.length/2)], medLng=lngs[Math.floor(lngs.length/2)];
 let used=pool.filter(s=>gpsDistanceMeters(s.lat,s.lng,medLat,medLng)<=Math.max(s.accuracy*1.5,3));
 if(!used.length) used=pool;

 let sumW=0,sumLat=0,sumLng=0;
 used.forEach(s=>{const w=1/(s.accuracy*s.accuracy); sumW+=w; sumLat+=s.lat*w; sumLng+=s.lng*w;});
 const lat=sumLat/sumW, lng=sumLng/sumW;

 // GPS 오차는 몇 초 사이에 거의 같은 방향으로 유지되므로 평균해도 크게 줄지 않음.
 // → 개선폭을 최대 √3배로 제한하고, 샘플들이 흩어진 정도(spread)보다 작게 표시하지 않음
 const typical=Math.sqrt(used.length/sumW);
 let spread=0;
 used.forEach(s=>{const d=gpsDistanceMeters(s.lat,s.lng,lat,lng); spread+=d*d/(s.accuracy*s.accuracy);});
 spread=Math.sqrt(spread/sumW);
 const acc=Math.max(typical/Math.sqrt(Math.min(used.length,3)),spread,1);
 return {lat,lng,accuracy:Math.round(acc*10)/10,count:used.length};
}

// ── 예열: 백그라운드 연속 수신 ──
function startLiveGps(){
 if(!navigator.geolocation||gpsLiveId!==null) return;
 gpsLiveId=navigator.geolocation.watchPosition(p=>{
   const c=p.coords;
   gpsBuffer.push({lat:c.latitude,lng:c.longitude,accuracy:c.accuracy||50,speed:c.speed,t:Date.now()});
   const cut=Date.now()-GPS_BUFFER_MS;
   while(gpsBuffer.length&&gpsBuffer[0].t<cut) gpsBuffer.shift();
   if(gpsMeasuring) checkMeasureDone(); else showLiveStatus();
 },err=>{
   console.error(err);
   const s=document.getElementById('gpsStatus');
   if(err.code===1){
     stopLiveGps();
     if(s){ s.textContent='위치 권한이 거부되었습니다. 설정에서 위치 접근을 허용해주세요.'; s.style.color='red'; }
     if(gpsMeasuring) endMeasure(false);
   }else if(err.code===2 && s && !gpsMeasuring && !currentAcc){
     s.textContent='위치 정보를 사용할 수 없습니다. GPS가 켜져 있는지 확인해주세요.'; s.style.color='red';
   }
 },{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function stopLiveGps(){
 if(gpsLiveId!==null){ navigator.geolocation.clearWatch(gpsLiveId); gpsLiveId=null; }
}

// ── 측정 ──
function measureSamples(){
 // 버튼 누르기 직전 몇 초 + 누른 이후 샘플, 걷는 중이던 샘플은 제외
 const from=gpsMeasureStart-GPS_WINDOW_MS;
 return gpsBuffer.filter(s=>s.t>=from && !(s.speed!=null && s.speed>GPS_MOVING_SPEED));
}
function checkMeasureDone(){
 if(!gpsMeasuring) return;
 const elapsed=Date.now()-gpsMeasureStart;
 const samples=measureSamples();
 const s=document.getElementById('gpsStatus');
 const r=samples.length?computeWeightedPosition(samples):null;
 if(s){
   const sec=Math.max(0,Math.ceil((GPS_MAX_MS-elapsed)/1000));
   s.innerHTML=r?`측정 중 ±${r.accuracy}m · 샘플 ${samples.length}개 (최대 ${sec}초)`:`위성 신호 수신 중... (최대 ${sec}초)`;
   s.style.color='#2563eb';
 }
 if(elapsed<GPS_MIN_MS) return;
 const lim=gpsLimit()||5;
 // 샘플이 충분하고 기준을 만족하면 바로 확정
 if(r && samples.length>=GPS_MIN_SAMPLES && r.accuracy<=lim) endMeasure(true);
}
function endMeasure(finalize){
 gpsMeasuring=false;
 clearTimeout(gpsMeasureTimer); clearInterval(gpsTickTimer);
 if(finalize) finalizeGps();
}
async function finalizeGps(){
 const s=document.getElementById('gpsStatus');
 const samples=measureSamples();
 if(!samples.length){
   if(s){ s.textContent='GPS 수신 실패 - 하늘이 트인 곳에서 다시 시도해주세요'; s.style.color='red'; }
   setSaveEnabled(false);
   return;
 }
 const r=computeWeightedPosition(samples);
 currentLat=r.lat.toFixed(7);
 currentLng=r.lng.toFixed(7);
 currentAcc=r.accuracy;
 currentSamples=r.count;
 updateGpsStatus();
 await reverseGeocode(r.lat,r.lng);
 document.getElementById('gpsCoord').textContent=`${r.lat.toFixed(7)}, ${r.lng.toFixed(7)}`;
}
function startGpsCollection(){
 if(!navigator.geolocation){ showToast('이 기기는 GPS 기능을 지원하지 않습니다.','error'); return; }
 startLiveGps();
 currentAcc=''; currentLat=''; currentLng=''; currentSamples=0;
 gpsMeasuring=true;
 gpsMeasureStart=Date.now();
 setSaveEnabled(false,'<i class="fa-solid fa-satellite-dish text-lg"></i> GPS 측정 중...');
 clearTimeout(gpsMeasureTimer); clearInterval(gpsTickTimer);
 gpsMeasureTimer=setTimeout(()=>endMeasure(true),GPS_MAX_MS);
 gpsTickTimer=setInterval(checkMeasureDone,500);
 checkMeasureDone();
}

// 저장 후 호출: 다음 지점에서 이전 좌표가 쓰이지 않도록 초기화
function resetGpsFix(){
 currentAcc=''; currentLat=''; currentLng=''; currentSamples=0;
 setSaveEnabled(false,'<i class="fa-solid fa-location-crosshairs text-lg"></i> 다음 지점 GPS 측정 필요');
 const s=document.getElementById('gpsStatus');
 if(s){ s.textContent='다음 지점으로 이동 후 위치 버튼을 누르세요'; s.style.color='#64748b'; }
 setTimeout(showLiveStatus,3000);
}

document.addEventListener('DOMContentLoaded',()=>{
 loadGpsMode();
 const gpsBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('현재 위치'));
 if(gpsBtn) gpsBtn.addEventListener('click',()=>startGpsCollection());
 const limitSel=document.getElementById('gpsLimit');
 if(limitSel) limitSel.addEventListener('click',e=>e.stopPropagation());

 startLiveGps(); // 예열 시작
 if(document.getElementById('autoGpsMode')?.checked) setTimeout(startGpsCollection,800);

 // 화면이 꺼지거나 다른 앱으로 가면 배터리 절약을 위해 중지, 돌아오면 재시작
 document.addEventListener('visibilitychange',()=>{
   if(document.hidden){ if(!gpsMeasuring) stopLiveGps(); }
   else startLiveGps();
 });
});
</script>
