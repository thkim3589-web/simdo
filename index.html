<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>심도측정 시스템 V43.2 (Kakao)</title>
    <!-- Tailwind CSS CDN 및 FontAwesome 아이콘 적용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

            user-select: text; -webkit-user-select: text;
        }
    </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-50 text-gray-900 antialiased safe-bottom">

    <!-- 1. 상단 고정 헤더 -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-lg font-bold text-blue-600 flex items-center gap-2">
            <i class="fa-solid fa-compass-drafting"></i> 심도측정 <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-medium">V43.2</span>
        </h1>
        <div class="flex items-center gap-1.5 bg-gray-100 px-3 py-1 rounded-full text-sm font-medium text-gray-700">
            <i class="fa-solid fa-circle-user text-gray-500"></i>
            <span id="userNameDisplay"></span>
            <button type="button" id="changeUserBtn" class="ml-2 text-blue-600 text-xs border px-2 py-0.5 rounded">변경</button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 2. 위치 및 주소 카드 (원터치 GPS 통합) -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200/80 space-y-3">
            <h2 class="text-sm font-bold text-gray-500 flex items-center gap-1.5 uppercase tracking-wider">
                <i class="fa-solid fa-location-dot text-blue-500"></i> 위치 및 주소 정보
            </h2>
            
            <!-- GPS 수집 버튼 (주소조회 통합 컴포넌트) -->
            <button type="button" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold py-3 px-4 rounded-lg text-sm transition-all flex items-center justify-between border border-blue-200 active:scale-[0.99]">
<div class="flex items-center gap-2">
<i class="fa-solid fa-location-crosshairs text-base animate-pulse"></i>
<span>현재 위치(GPS) 자동 가져오기</span>
</div>
<div class="flex items-center gap-2">
<span id="gpsModeText">OFF</span>
<input type="checkbox" id="autoGpsMode" class="w-5 h-5">
</div>
</button>

            <!-- 주소 매핑 결과 창 -->
            <div class="bg-gray-50 p-3 rounded-lg space-y-2 text-sm border border-gray-100">
                <div class="flex justify-between items-start">
                    <span class="text-gray-400 w-16 font-medium">도로명</span>
                    <span class="text-gray-700 flex-1 font-medium"><span id="roadAddr">도로명 주소를 불러오는 중...</span></span>
                </div>
                <div class="border-t border-gray-200/60 my-1.5"></div>
                <div class="flex justify-between items-start">
                    <span class="text-gray-400 w-16 font-medium">지번</span>
                    <span class="text-gray-600 flex-1 text-xs font-mono"><span id="jibunAddr">지번을 불러오는 중...</span></span></div><div class="border-t border-gray-200/60 my-1.5"></div><div class="flex justify-between items-start"><span class="text-gray-400 w-16 font-medium">GPS</span><span class="text-gray-600 flex-1 text-xs font-mono"><span id="gpsCoord">GPS를 불러오는 중...</span></span>
                </div>
            </div>
        
<div id="gpsStatus" class="text-center text-sm font-bold text-red-500 mt-2">GPS 대기중</div>

</section>

        
        <!-- 관리번호 입력 카드 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200/80 space-y-3">
            <label for="manageNo" class="text-sm font-bold text-gray-500 flex items-center gap-1.5 uppercase tracking-wider">
                <i class="fa-solid fa-hashtag text-blue-500"></i> 관리번호 입력
            </label>
            <input type="text" id="manageNo" placeholder="예: 달서CD1776"
                   class="w-full bg-gray-50 border-2 border-gray-200 focus:border-blue-500 focus:bg-white rounded-xl py-3 px-4 text-base font-bold text-gray-800 transition-all focus:outline-none">
        </section>

<!-- 3. 심도 입력 카드 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200/80 space-y-3">
            <label for="depth" class="text-sm font-bold text-gray-500 flex items-center gap-1.5 uppercase tracking-wider">
                <i class="fa-solid fa-ruler-vertical text-blue-500"></i> 측정 심도 입력
            </label>
            <div class="relative flex items-center">
                <input type="number" id="depth" step="0.01" placeholder="0.00" 
                       class="w-full bg-gray-50 border-2 border-gray-200 focus:border-blue-500 focus:bg-white rounded-xl py-3.5 px-4 text-2xl font-bold text-gray-800 transition-all text-right pr-12 focus:outline-none">
                <span class="absolute right-4 text-lg font-bold text-gray-400">m</span>
            </div>
        </section>

<!-- 7. 하단 고정 메인 액션 버튼 (CTA) -->
    <div class="bg-white p-3 mt-3">
        <button id="saveBtn" type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-base active:scale-[0.98]">
            <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
            심도 데이터 저장하기
        </button>
    </div>


        <!-- 4. 오늘의 통계 대시보드 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200/80 space-y-3">
            <h2 class="text-sm font-bold text-gray-500 flex items-center gap-1.5 uppercase tracking-wider">
                <i class="fa-solid fa-chart-simple text-blue-500"></i> 오늘의 측정 현황
            </h2>
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100">
                    <p class="text-xs text-gray-400 font-medium mb-0.5">총 건수</p>
                    <p class="text-lg font-bold text-gray-800">2 <span class="text-xs font-normal text-gray-500">건</span></p>
                </div>
                <div class="bg-blue-50/50 p-2.5 rounded-lg text-center border border-blue-50">
                    <p class="text-xs text-blue-500 font-medium mb-0.5">평균 심도</p>
                    <p class="text-lg font-bold text-blue-600">1.15<span class="text-xs font-normal text-blue-500">m</span></p>
                </div>
                <div class="bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100">
                    <p class="text-xs text-gray-400 font-medium mb-0.5">최대/최소</p>
                    <p class="text-sm font-bold text-gray-700 mt-1">1.20 / 1.10</p>
                </div>
            </div>
        </section>

        <!-- 5. 모바일 최적화 카드형 리스트 -->
        <section class="space-y-2">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-gray-500 flex items-center gap-1.5 uppercase tracking-wider">
                    <i class="fa-solid fa-list-ul text-blue-500"></i> 최근 저장 이력
                </h2>
                <span id="lastSavedTime" class="ml-auto text-xs text-gray-400 text-right"></span>
            </div>
            <!-- 리스트 제어 서브 버튼 -->
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button class="py-2 px-3 border border-gray-300 text-gray-600 rounded-lg text-xs font-semibold hover:bg-gray-50 active:bg-gray-100">
                    <i class="fa-solid fa-trash-can mr-1"></i> 선택 삭제
                </button>
                <button class="py-2 px-3 border border-red-200 text-red-500 rounded-lg text-xs font-semibold hover:bg-red-50 active:bg-red-100">
                    <i class="fa-solid fa-dumpster-fire mr-1"></i> 전체 삭제
                </button>
            </div>
        </section>

        <!-- 6. 유틸리티 관리 영역 (백업/엑셀) -->
        <section class="pt-2 pb-6 border-t border-gray-200/80 grid grid-cols-3 gap-2 text-center text-xs text-gray-500 font-medium">
            <button class="hover:text-blue-600 py-1.5"><i class="fa-solid fa-floppy-disk mr-1"></i>데이터 백업</button>
            <button class="hover:text-blue-600 py-1.5"><i class="fa-solid fa-file-arrow-up mr-1"></i>데이터 복원</button>
            <button class="hover:text-green-600 py-1.5 font-semibold text-green-600"><i class="fa-solid fa-file-excel mr-1"></i>엑셀 내보내기</button>
        </section>

    </main>

    


<script>
// 간단한 토스트 알림 - 확인이 필요 없는 단순 안내/성공/오류 메시지에 alert() 대신 사용
// (삭제 등 사용자의 '결정'이 필요한 경우는 여전히 confirm()을 사용)
function showToast(message, type){
  type = type || 'info';
  const colors = { info:'#2563eb', success:'#16a34a', error:'#dc2626', warn:'#ca8a04' };
  const el = document.createElement('div');
  el.textContent = message;
  el.style.cssText = `position:fixed;left:50%;bottom:110px;transform:translateX(-50%);`+
    `background:${colors[type]||colors.info};color:#fff;padding:10px 16px;`+
    `border-radius:9999px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.18);`+
    `z-index:99999;max-width:88%;text-align:center;opacity:0;transition:opacity .2s ease;`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity='1'; });
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),250); },2200);
}

let currentLat='';
let currentLng='';
let currentAcc='';
const DEPTH_KEY='depth_records_v35';

function loadRecords(){
  return JSON.parse(localStorage.getItem(DEPTH_KEY)||'[]');
}
function saveRecords(arr){
  localStorage.setItem(DEPTH_KEY,JSON.stringify(arr));
}
function refreshStats(){
  const arr=loadRecords();
  const nums=arr.map(x=>Number(x.depth)).filter(x=>!isNaN(x));
  const ps=document.querySelectorAll('p');
  if(nums.length){
    const avg=(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2);
    const max=Math.max(...nums).toFixed(2);
    const min=Math.min(...nums).toFixed(2);
    ps.forEach(p=>{
      if(p.textContent.includes('총 건수')) p.nextElementSibling.innerHTML=`${nums.length} <span class="text-xs">건</span>`;
      if(p.textContent.includes('평균 심도')) p.nextElementSibling.innerHTML=`${avg}<span class="text-xs">m</span>`;
      if(p.textContent.includes('최대/최소')) p.nextElementSibling.textContent=`${max} / ${min}`;
    });
  }
  const sec=[...document.querySelectorAll('section')].find(s=>s.textContent.includes('최근 저장 이력'));
  if(sec){
    sec.querySelectorAll('.record-item').forEach(e=>e.remove());
    arr.slice().reverse().forEach((r,i)=>{
      const d=document.createElement('div');
      d.className='record-item bg-white p-3 rounded-xl shadow-sm border border-gray-200 mt-2';
      d.innerHTML=`
<div class="flex items-start gap-3">
<input type="checkbox" class="w-5 h-5 mt-1">
<div class="flex-1">
  <div class="flex items-center gap-2 mb-1">
    <span class="text-xs bg-gray-100 text-gray-700 font-bold px-2 py-1 rounded">No.${arr.length-i}</span>
    <span class="text-xs text-gray-500">${r.time}</span>
  </div>
  <div class="text-sm font-medium text-gray-800">${r.manageNo ? '['+r.manageNo+'] ' : ''}${r.address||'주소 없음'}</div>
</div>
<div class="text-right whitespace-nowrap">
  <span class="text-3xl font-black text-gray-900">${Number(r.depth).toFixed(2)}</span><span class="text-base font-bold"> m</span>
</div>
</div>`;
      sec.insertBefore(d,sec.querySelector('.grid'));
    const lastSaved=document.getElementById('lastSavedTime');
    if(lastSaved){
      if(arr.length){
        const dateOnly=arr[arr.length-1].time.split('오전')[0].split('오후')[0].trim();
        lastSaved.textContent='최근 저장 : '+dateOnly;
      }else{
        lastSaved.textContent='';
      }
    }

    });
  }
}
document.addEventListener('DOMContentLoaded',()=>{

 const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('심도 데이터 저장'));
 const input=document.getElementById('depth');
 if(btn&&input){
   // GPS 좌표를 확보하기 전에는 저장할 수 없도록 기본 비활성화 상태로 시작
   // (updateGpsStatus()에서 GPS 측위 성공 시 자동으로 다시 활성화됨)
   btn.disabled=true;
   btn.style.opacity='0.6';

   btn.addEventListener('click',()=>{
     if(btn.disabled) return; // 중복 클릭 방지

     if(!currentAcc){
       showToast('먼저 GPS 위치를 측정해주세요.','error');
       return;
     }

     const v=parseFloat(input.value);
     if(isNaN(v)){ showToast('심도를 입력하세요.','error'); return; }
     if(v<0){ showToast('심도는 0 이상의 값이어야 합니다.','error'); return; }
     if(v>50){
       if(!confirm(`입력하신 심도(${v}m)가 비정상적으로 큰 값입니다. 계속 저장하시겠습니까?`)) return;
     }

     const manageNo=document.getElementById('manageNo')?.value?.trim()||'';
     if(!manageNo){
       if(!confirm('관리번호가 입력되지 않았습니다. 관리번호 없이 저장하시겠습니까?')) return;
     }

     btn.disabled=true;
     const arr=loadRecords();
     const addr=(document.getElementById('roadAddr')?.textContent||document.getElementById('jibunAddr')?.textContent||'');
     const now=new Date();
     const time=`${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')}. ${now.getHours()<12?'오전':'오후'} ${String((now.getHours()%12)||12).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
     arr.push({manageNo,depth:v,time:time,address:addr,latitude:currentLat,longitude:currentLng,accuracy:currentAcc});
     saveRecords(arr);
     refreshStats();
     showToast('저장되었습니다.','success');
     input.value='';
     input.focus();
     setTimeout(()=>{ btn.disabled=false; },800); // 중복 저장 방지용 짧은 잠금 해제
   });
 }
 refreshStats();
});
</script>




<script>
document.addEventListener('DOMContentLoaded',()=>{
  const KEY='depth_user_name';
  const nameSpan=document.getElementById('userNameDisplay');
  const btn=document.getElementById('changeUserBtn');
  function load(){
    const n=localStorage.getItem(KEY)||'김태호';
    nameSpan.textContent=n;
  }
  load();
  btn.addEventListener('click',()=>{
    const current=localStorage.getItem(KEY)||'김태호';
    const v=prompt('사용자명을 입력하세요.',current);
    if(v && v.trim()){
      localStorage.setItem(KEY,v.trim());
      load();
    }
  });
});
</script><script>

document.addEventListener('DOMContentLoaded',()=>{
  const sec=[...document.querySelectorAll('section')].find(s=>s.textContent.includes('최근 저장 이력'));
  if(!sec) return;
  const buttons=sec.querySelectorAll('.grid button');
  if(buttons.length<2) return;
  const selBtn=buttons[0], allBtn=buttons[1];

  function redraw(){ refreshStats(); }

  selBtn.addEventListener('click',()=>{
    let arr=loadRecords();
    if(arr.length===0){ showToast('삭제할 데이터가 없습니다.','warn'); return; }
    // 이력 카드(.record-item) 내부 체크박스만 정확히 선택 (다른 영역 체크박스와 인덱스 혼선 방지)
    const checks=[...sec.querySelectorAll('.record-item input[type=checkbox]')];
    const checkedCount=checks.filter(c=>c.checked).length;
    if(checkedCount===0){ showToast('선택된 항목이 없습니다.','warn'); return; }
    if(!confirm(`선택한 ${checkedCount}건을 삭제하시겠습니까?`)) return;
    const rev=arr.slice().reverse();
    const kept=[];
    rev.forEach((r,i)=>{
      if(!(checks[i] && checks[i].checked)) kept.push(r);
    });
    saveRecords(kept.reverse());
    redraw();
    showToast('선택한 항목을 삭제했습니다.','success');
  });

  allBtn.addEventListener('click',()=>{
    if(!confirm('모든 데이터를 삭제하시겠습니까?')) return;
    localStorage.removeItem(DEPTH_KEY);
    redraw();
    showToast('전체 삭제되었습니다.','success');
  });
});

</script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
 const excelBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('엑셀'));
 if(!excelBtn) return;
 excelBtn.addEventListener('click',()=>{
   const data=loadRecords();
   if(!data.length){showToast('내보낼 데이터가 없습니다.','warn');return;}
   const rows=data.map((r,i)=>({번호:i+1,관리번호:r.manageNo||'',주소:r.address||'',심도_m:r.depth,측정시간:r.time,위도:r.latitude||'',경도:r.longitude||'',GPS정확도_m:r.accuracy||''}));
   const ws=XLSX.utils.json_to_sheet(rows);
   const wb=XLSX.utils.book_new();
   XLSX.utils.book_append_sheet(wb,ws,'심도측정');
   const manageNo = data[0]?.manageNo || '심도측정';

    XLSX.writeFile(wb, `${manageNo}_심도측정_${ymd}.xlsx`);
 });
});
</script>


<script>
document.addEventListener('DOMContentLoaded',()=>{
 const backupBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('데이터 백업'));
 const restoreBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('데이터 복원'));
 if(!backupBtn||!restoreBtn) return;

 backupBtn.onclick=()=>{
   const data={
     version:'V43.2',
     user:localStorage.getItem('depth_user_name')||'',
     records:JSON.parse(localStorage.getItem('depth_records_v35')||'[]')
   };
   const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
   const a=document.createElement('a');
   a.href=URL.createObjectURL(blob);
   const d=new Date();
   const f=`심도측정_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}.json`;
   a.download=f;
   a.click();
   URL.revokeObjectURL(a.href);
 };

 const input=document.createElement('input');
 input.type='file';
 input.accept='.json';
 input.style.display='none';
 document.body.appendChild(input);

 restoreBtn.onclick=()=>input.click();

 input.onchange=(e)=>{
   const file=e.target.files[0];
   if(!file) return;
   const fr=new FileReader();
   fr.onload=()=>{
     try{
       const obj=JSON.parse(fr.result);
       if(!obj.records || !Array.isArray(obj.records)) throw new Error('invalid backup format');

       // 항목별로 최소 형식(심도가 숫자로 변환 가능한지)을 검증해 손상된 레코드가
       // 이후 통계/리스트 렌더링에서 오류를 일으키지 않도록 함
       const validRecords = obj.records.filter(r => r && typeof r==='object' && !isNaN(parseFloat(r.depth)));
       const skipped = obj.records.length - validRecords.length;

       if(validRecords.length===0){
         showToast('복원할 유효한 데이터가 없습니다.','error');
         return;
       }

       const confirmMsg = skipped>0
         ? `기존 데이터를 복원 데이터(${validRecords.length}건, 형식 오류 ${skipped}건 제외)로 덮어쓰시겠습니까?`
         : `기존 데이터를 복원 데이터(${validRecords.length}건)로 덮어쓰시겠습니까?`;
       if(!confirm(confirmMsg)) return;

       localStorage.setItem('depth_records_v35',JSON.stringify(validRecords));
       if(obj.user) localStorage.setItem('depth_user_name',obj.user);
       showToast('복원이 완료되었습니다. 화면을 새로고침합니다.','success');
       setTimeout(()=>location.reload(),600);
     }catch{
       showToast('올바른 백업 파일이 아닙니다.','error');
     }
   };
   fr.readAsText(file);
 };
});
</script>

<script>
/*
 * ⚠️ 보안 주의: 아래 카카오 REST API 키는 클라이언트(브라우저) 코드에 그대로 노출되어
 * 누구나 페이지 소스에서 확인/도용할 수 있는 상태입니다. 근본적인 해결을 위해서는:
 *   1) 카카오 개발자 콘솔에서 이 키를 재발급(폐기)하고,
 *   2) 재발급한 키에 '플랫폼 > Web' 도메인 제한(허용 도메인만 등록)을 설정하세요.
 * 코드 구조상 키를 여기 상수 하나로만 관리하도록 분리해두었으니, 재발급 후에는
 * 아래 KAKAO_API_KEY 값만 교체하면 됩니다. (완전한 보안 조치는 서버를 경유하는
 * 프록시 구성이며, 정적 페이지 구조상 최선의 완화책은 도메인 제한입니다.)
 */
const KAKAO_API_KEY = 'eaa5300f4046bfac8ce0355b1bd8cd88';

async function reverseGeocode(lat,lng){
 const road=document.getElementById('roadAddr');
 const jibun=document.getElementById('jibunAddr');
 const gps=document.getElementById('gpsCoord');

 gps.textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
 road.textContent='주소 조회 중...';
 jibun.textContent='주소 조회 중...';

 try{
   const controller=new AbortController();
   const timeoutId=setTimeout(()=>controller.abort(),8000);

   const response=await fetch(
    `https://dapi.kakao.com/v2/local/geo/coord2address.json?x=${lng}&y=${lat}&input_coord=WGS84`,
    {
      headers:{
        Authorization:`KakaoAK ${KAKAO_API_KEY}`
      },
      signal:controller.signal
    }
   );
   clearTimeout(timeoutId);

   if(!response.ok){
     // API 키/도메인 제한(401,403), 쿼터 초과(429), 잘못된 요청(400) 등 실제 API 오류
     if(response.status===401 || response.status===403){
       road.textContent='주소 조회 실패 (API 인증 오류)';
       jibun.textContent='카카오 API 키/도메인 설정을 확인하세요';
     }else if(response.status===429){
       road.textContent='주소 조회 실패 (요청 한도 초과)';
       jibun.textContent='잠시 후 다시 시도해주세요';
     }else{
       road.textContent=`주소 조회 실패 (오류 코드 ${response.status})`;
       jibun.textContent='잠시 후 다시 시도해주세요';
     }
     return;
   }

   const data=await response.json();

   if(data.documents && data.documents.length){
      const doc=data.documents[0];
      // 도로명 주소가 없는 지점(도로명 미부여 구역 등)과 지번 주소를 명확히 구분
      road.textContent = doc.road_address?.address_name || '도로명 없음 (미부여 지역)';
      jibun.textContent = doc.address?.address_name || '지번 주소 없음';
   }else{
      // API 응답은 정상이지만 좌표에 매칭되는 주소가 실제로 없는 경우(바다, 행정구역 밖 등)
      road.textContent='해당 좌표에 등록된 주소 없음';
      jibun.textContent='해당 좌표에 등록된 주소 없음';
   }
 }catch(e){
   // 네트워크 단절, 타임아웃(8초) 등 요청 자체가 실패한 경우
   if(e.name==='AbortError'){
     road.textContent='주소 조회 시간 초과';
     jibun.textContent='네트워크 상태를 확인 후 다시 시도해주세요';
   }else{
     road.textContent='주소 조회 실패 (네트워크 오류)';
     jibun.textContent='인터넷 연결을 확인해주세요';
   }
 }
}
</script>


<script>
/*
 * GPS 정밀 측위 로직
 * - watchPosition으로 일정 시간(기본 8초) 동안 여러 샘플을 연속 수집
 * - 중앙값 기준 이상치(튐값) 샘플 제거
 * - 정확도(accuracy)가 좋을수록 가중치를 높게 주는 가중평균으로 좌표 확정
 * - 매우 정확한 샘플(≤3m)이 충분히 모이면 8초를 기다리지 않고 조기 종료
 */
const GPS_MODE_KEY='AUTO_GPS_MODE';
const GPS_COLLECT_MS=8000;      // 최대 수집 시간
const GPS_MIN_COLLECT_MS=3000;  // 조기 종료를 허용하기 전 최소 수집 시간(도심 반사파 등 순간적 오탐 방지)
const GPS_MIN_SAMPLES=3;        // 조기 종료를 위한 최소 샘플 수
const GPS_EXCELLENT_ACC=3;      // 이 정확도(m) 이하면 조기 종료 후보로 인정
let gpsWatchId=null,gpsCollectTimer=null,gpsSamples=[],gpsStartTime=0;

function loadGpsMode(){
 const chk=document.getElementById('autoGpsMode');
 const txt=document.getElementById('gpsModeText');
 const mode=localStorage.getItem(GPS_MODE_KEY)==='true';
 if(!chk) return;
 chk.checked=mode;
 txt.textContent=mode?'ON':'OFF';
 chk.onchange=()=>{
   localStorage.setItem(GPS_MODE_KEY,chk.checked);
   txt.textContent=chk.checked?'ON':'OFF';
 };
}

function updateGpsStatus(){
 const s=document.getElementById('gpsStatus');
 if(!s||!currentAcc) return;

 const saveBtn=document.getElementById('saveBtn');
 if(saveBtn){
   saveBtn.disabled=false;
   saveBtn.style.opacity='1';
   saveBtn.style.background='#2563eb';
   saveBtn.innerHTML='<i class="fa-solid fa-cloud-arrow-up text-lg"></i> 심도 데이터 저장하기';
 }

 // 참고: 표시되는 정확도는 8초간 수집한 샘플의 가중평균 기반 추정치이며,
 // 건물 밀집지역 등 위성신호 반사(멀티패스)가 있는 환경에서는
 // 실제 오차가 이 값보다 클 수 있으므로 참고용으로만 사용하세요.
 if(currentAcc<=5){
   s.textContent=`양호 (추정 ±${currentAcc}m, 주변 환경에 따라 오차 클 수 있음)`;
   s.style.color='green';
 }else if(currentAcc<=10){
   s.textContent=`저장 가능 (추정 ±${currentAcc}m)`;
   s.style.color='blue';
 }else if(currentAcc<=20){
   s.textContent=`재측정 권장 (추정 ±${currentAcc}m)`;
   s.style.color='#ca8a04';
 }else{
   s.textContent=`GPS 재측정 필요 (추정 ±${currentAcc}m)`;
   s.style.color='red';
 }
}

// 두 좌표 사이 거리(m) - Haversine 공식
function gpsDistanceMeters(lat1,lng1,lat2,lng2){
 const R=6371000;
 const toRad=d=>d*Math.PI/180;
 const dLat=toRad(lat2-lat1);
 const dLng=toRad(lng2-lng1);
 const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 이상치 제거 후 정확도 가중평균 좌표 계산
function computeWeightedPosition(samples){
 if(!samples.length) return null;

 const lats=samples.map(s=>s.lat).slice().sort((a,b)=>a-b);
 const lngs=samples.map(s=>s.lng).slice().sort((a,b)=>a-b);
 const medLat=lats[Math.floor(lats.length/2)];
 const medLng=lngs[Math.floor(lngs.length/2)];

 let filtered=samples.filter(s=>gpsDistanceMeters(s.lat,s.lng,medLat,medLng) <= Math.max(s.accuracy*3,30));
 if(!filtered.length) filtered=samples;

 let sumW=0,sumLat=0,sumLng=0;
 filtered.forEach(s=>{
   const w=1/(s.accuracy*s.accuracy);
   sumW+=w; sumLat+=s.lat*w; sumLng+=s.lng*w;
 });

 return {
   lat:sumLat/sumW,
   lng:sumLng/sumW,
   accuracy:Math.sqrt(1/sumW) // 결합 표준오차(대략적 최종 정확도)
 };
}

function stopGpsCollection(finalize){
 if(gpsWatchId!==null){
   navigator.geolocation.clearWatch(gpsWatchId);
   gpsWatchId=null;
 }
 if(gpsCollectTimer){
   clearTimeout(gpsCollectTimer);
   gpsCollectTimer=null;
 }
 if(finalize) finalizeGps();
}

async function finalizeGps(){
 const s=document.getElementById('gpsStatus');
 if(!gpsSamples.length){
   if(s){ s.textContent='GPS 수신 실패 - 다시 시도해주세요'; s.style.color='red'; }
   return;
 }
 const result=computeWeightedPosition(gpsSamples);
 currentLat=result.lat.toFixed(6);
 currentLng=result.lng.toFixed(6);
 currentAcc=Math.max(1,Math.round(result.accuracy));
 await reverseGeocode(result.lat,result.lng);
 updateGpsStatus();
}

function startGpsCollection(){
 if(!navigator.geolocation){
   showToast('이 브라우저는 GPS 기능을 지원하지 않습니다.','error');
   return;
 }
 stopGpsCollection(false);
 gpsSamples=[];
 gpsStartTime=Date.now();

 const s=document.getElementById('gpsStatus');
 if(s){ s.textContent='GPS 측정 중... 이동하지 말고 잠시 기다려주세요'; s.style.color='#2563eb'; }
 const saveBtn=document.getElementById('saveBtn');
 if(saveBtn){ saveBtn.disabled=true; saveBtn.style.opacity='0.6'; }

 gpsWatchId=navigator.geolocation.watchPosition((p)=>{
   const acc=p.coords.accuracy||50;
   gpsSamples.push({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:acc});
   const elapsed=Date.now()-gpsStartTime;
   // 최소 수집 시간(GPS_MIN_COLLECT_MS)을 채운 뒤에만 조기 종료 허용
   // - 순간적으로 정확도가 좋게 찍히는 튐값 하나만으로 너무 이르게 확정되는 것을 방지
   if(acc<=GPS_EXCELLENT_ACC && gpsSamples.length>=GPS_MIN_SAMPLES && elapsed>=GPS_MIN_COLLECT_MS){
     stopGpsCollection(true);
   }
 },(err)=>{
   console.error(err);
   const status=document.getElementById('gpsStatus');
   if(err.code===1){
     // PERMISSION_DENIED: 8초를 기다릴 필요 없이 즉시 안내하고 수집 중단
     stopGpsCollection(false);
     if(status){ status.textContent='위치 권한이 거부되었습니다. 브라우저 설정에서 위치 접근을 허용해주세요.'; status.style.color='red'; }
     if(saveBtn){ saveBtn.disabled=true; saveBtn.style.opacity='0.6'; }
   }else if(err.code===2){
     // POSITION_UNAVAILABLE
     if(status){ status.textContent='위치 정보를 사용할 수 없습니다. GPS 신호를 확인해주세요.'; status.style.color='red'; }
   }
   // code 3(TIMEOUT)은 watchPosition이 내부적으로 계속 재시도하므로 별도 처리 없이 대기
 },{enableHighAccuracy:true,maximumAge:0,timeout:GPS_COLLECT_MS});

 gpsCollectTimer=setTimeout(()=>{
   stopGpsCollection(true);
 },GPS_COLLECT_MS);
}

document.addEventListener('DOMContentLoaded',()=>{
 loadGpsMode();
 const gpsBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('현재 위치'));
 if(gpsBtn){
   gpsBtn.addEventListener('click',()=>{
      startGpsCollection();
   });
 }
 setTimeout(()=>{
   if(document.getElementById('autoGpsMode')?.checked) startGpsCollection();
 },1000);
});
</script>
