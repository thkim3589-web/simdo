<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시설 찾기 · 심도측정</title>
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="./lib/fontawesome/css/fontawesome.min.css">
<link rel="stylesheet" href="./lib/fontawesome/css/solid.min.css">
<link rel="stylesheet" href="./lib/leaflet/leaflet.css">
<style>
  :root{ --blue:#2563eb; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --bg:#f9fafb; --red:#ef4444; --purple:#7c3aed; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; font-family:-apple-system,"Malgun Gothic","맑은 고딕",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  body{ display:flex; flex-direction:column; }
  header{ background:#fff; border-bottom:1px solid var(--line); padding:10px 12px; display:flex; align-items:center; gap:8px; box-shadow:0 1px 2px rgba(0,0,0,.04); z-index:1000; }
  .icon-btn{ width:38px; height:38px; flex:0 0 38px; border:0; border-radius:999px; background:#f3f4f6; color:#4b5563; font-size:16px; display:flex; align-items:center; justify-content:center; }
  header h1{ font-size:17px; margin:0; color:var(--blue); font-weight:800; white-space:nowrap; }
  .search{ padding:10px 12px; background:#fff; border-bottom:1px solid var(--line); z-index:1000; }
  .search form{ display:flex; gap:6px; }
  .search input{ flex:1; min-width:0; border:2px solid var(--line); background:var(--bg); border-radius:12px; padding:11px 12px; font-size:16px; font-weight:700; color:var(--ink); outline:none; }
  .search input:focus{ border-color:var(--blue); background:#fff; }
  .search button{ border:0; background:var(--blue); color:#fff; font-weight:800; font-size:15px; border-radius:12px; padding:0 16px; white-space:nowrap; }
  .scope{ display:flex; gap:6px; margin-top:8px; font-size:12px; font-weight:700; }
  .scope label{ display:flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; background:#64748b1a; color:#64748b; }
  .scope input{ margin:0; accent-color:var(--blue); }
  #mapWrap{ position:relative; flex:1; min-height:200px; }
  #map{ position:absolute; inset:0; background:#e5e7eb; }
  .map-ctl{ position:absolute; right:10px; z-index:900; display:flex; flex-direction:column; gap:6px; }
  .map-ctl.top{ top:10px; } .map-ctl.bottom{ bottom:12px; }
  .chip{ border:0; padding:6px 11px; border-radius:999px; font-size:12px; font-weight:700; background:#fff; color:#374151; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .chip.on{ background:#1f2937; color:#fff; }
  .round{ width:42px; height:42px; border:0; border-radius:999px; background:#fff; color:var(--blue); font-size:17px; box-shadow:0 1px 5px rgba(0,0,0,.25); }
  #panel{ background:#fff; border-top:1px solid var(--line); max-height:42vh; display:flex; flex-direction:column; z-index:1000; padding-bottom:env(safe-area-inset-bottom); }
  #panelHead{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; font-size:13px; font-weight:800; color:var(--sub); border:0; background:#fff; width:100%; }
  #panelHead .cnt{ background:#eff6ff; color:var(--blue); border-radius:999px; padding:1px 8px; margin-left:4px; }
  #panel.collapsed #list{ display:none; }
  #panel.collapsed #chev{ transform:rotate(180deg); }
  #list{ overflow-y:auto; padding:0 10px 10px; }
  .grp{ font-size:11px; font-weight:800; color:#9ca3af; margin:8px 4px 4px; }
  .item{ display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:6px; }
  .item.active{ border-color:var(--blue); background:#eff6ff; }
  .badge{ flex:0 0 auto; font-size:11px; font-weight:800; border-radius:6px; padding:3px 6px; margin-top:1px; }
  .b-mine{ background:#fee2e2; color:#dc2626; } .b-kakao{ background:#ede9fe; color:var(--purple); }
  .item .nm{ font-size:15px; font-weight:800; color:var(--ink); }
  .item .ad{ font-size:12px; color:var(--sub); margin-top:2px; word-break:break-all; }
  .item .meta{ font-size:11px; color:#9ca3af; margin-top:2px; }
  .empty{ text-align:center; color:#9ca3af; font-size:13px; padding:16px 8px; line-height:1.6; }
  .lbl{ background:#fff; border:2px solid var(--blue); color:var(--ink); font-weight:800; font-size:12px; padding:2px 7px; border-radius:8px; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .lbl.kakao{ border-color:var(--purple); }
  .leaflet-tooltip.lbl:before{ display:none; }
  .dep small{ display:block; text-align:right; font-size:11px; font-weight:800; }
  .lbl-적합{ border-color:#16a34a !important; } .lbl-미달{ border-color:#dc2626 !important; } .lbl-주의{ border-color:#eab308 !important; } .lbl-none{ border-color:#9ca3af !important; }
  .legend{ position:absolute; left:10px; top:10px; z-index:900; background:rgba(255,255,255,.92); border-radius:10px; padding:5px 8px; font-size:11px; font-weight:800; color:#374151; box-shadow:0 1px 4px rgba(0,0,0,.2); display:flex; gap:8px; }
  .legend i{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:3px; vertical-align:-1px; }
  .dep{ flex:0 0 auto; font-size:17px; font-weight:900; color:var(--blue); white-space:nowrap; margin-top:1px; }
  .b-fac{ background:#dcfce7; color:#15803d; }
  .lbl.fac{ border-color:#16a34a; }
  header .sp{ flex:1; }
  .hbtn{ border:0; border-radius:999px; background:#ecfdf5; color:#15803d; font-weight:800; font-size:13px; padding:9px 12px; white-space:nowrap; }
  #imp{ position:fixed; inset:0; z-index:6000; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; }
  #imp .sheet{ background:#fff; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #imp h3{ margin:0 0 4px; font-size:17px; }
  #imp .desc{ font-size:12px; color:var(--sub); line-height:1.6; margin-bottom:10px; }
  #imp .info{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px; color:#374151; margin-bottom:10px; }
  #imp .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0; font-size:14px; font-weight:700; }
  #imp select{ flex:0 0 58%; border:1px solid #d1d5db; border-radius:8px; padding:7px 8px; font-size:14px; font-weight:600; background:#fff; color:var(--ink); }
  #imp .btns{ display:flex; gap:8px; margin-top:12px; }
  #imp .btns button{ flex:1; border:0; border-radius:12px; padding:13px; font-size:15px; font-weight:800; }
  .b-pri{ background:var(--blue); color:#fff; } .b-sec{ background:#f3f4f6; color:#374151; } .b-del{ background:#fff; color:#dc2626; border:1px solid #fecaca !important; }
  .b-pri:disabled{ opacity:.5; }
  #imp table{ width:100%; border-collapse:collapse; font-size:11px; margin-top:6px; }
  #imp th,#imp td{ border:1px solid var(--line); padding:4px 5px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px; }
  #imp th{ background:#f3f4f6; }
  #impProg{ font-size:13px; font-weight:700; color:var(--blue); text-align:center; margin-top:8px; min-height:18px; }
  #toast{ position:fixed; left:50%; bottom:46vh; transform:translateX(-50%); background:#1f2937; color:#fff; font-size:13px; font-weight:700; padding:9px 15px; border-radius:999px; z-index:5000; opacity:0; transition:opacity .2s; pointer-events:none; max-width:88%; text-align:center; }
</style>
</head>
<body>
<header>
  <button type="button" class="icon-btn" id="backBtn" aria-label="뒤로"><i class="fa-solid fa-arrow-left"></i></button>
  <h1><i class="fa-solid fa-map-location-dot"></i> 시설 찾기</h1>
  <span class="sp"></span>
  <button type="button" class="hbtn" id="impOpen"><i class="fa-solid fa-file-excel"></i> 시설 목록</button>
</header>

<div class="search">
  <form id="searchForm" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="시설명 입력 (예: 논공통합국, 달서CD1776)">
    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
  </form>
  <div class="scope">
    <label><input type="checkbox" id="useFac" checked> 시설 목록 <span id="facCnt">0</span></label>
    <label><input type="checkbox" id="useMine" checked> 내 측정 기록</label>
    <label><input type="checkbox" id="useKakao" checked> 카카오 장소</label>
  </div>
</div>

<div id="mapWrap">
  <div id="map"></div>
  <div class="legend"><span><i style="background:#16a34a"></i>적합</span><span><i style="background:#dc2626"></i>미달</span><span><i style="background:#7c3aed"></i>장소</span><span><i style="background:#9ca3af"></i>판정없음</span><span><i style="background:none;border:2px dashed #f97316;width:8px;height:8px"></i>튐의심</span></div>
  <div class="map-ctl top">
    <button type="button" class="chip on" data-layer="map">일반</button>
    <button type="button" class="chip" data-layer="sat">위성</button>
  </div>
  <div class="map-ctl bottom">
    <button type="button" class="round" id="myLocBtn" aria-label="내 위치"><i class="fa-solid fa-location-crosshairs"></i></button>
  </div>
</div>

<div id="panel">
  <button type="button" id="panelHead">
    <span>검색 결과<span class="cnt" id="cnt">0</span></span>
    <i class="fa-solid fa-chevron-down" id="chev"></i>
  </button>
  <div id="list"><div class="empty">시설명을 입력하고 검색하세요.<br>내 측정 기록의 관리번호·주소와 카카오 장소를 함께 찾습니다.</div></div>
</div>
<div id="toast"></div>

<div id="imp">
  <div class="sheet">
    <h3><i class="fa-solid fa-file-excel" style="color:#16a34a"></i> 시설 목록 엑셀 불러오기</h3>
    <div class="desc">시설명과 <b>주소 또는 위도·경도</b>가 있는 엑셀(.xlsx, .xls, .csv)을 고르세요. 좌표가 없으면 주소로 위치를 찾습니다(인터넷 필요).</div>
    <div class="info" id="impCur"></div>
    <input type="file" id="impFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" style="display:none">
    <div id="impMap" style="display:none">
      <div class="info" id="impFileInfo"></div>
      <div class="row">시트 <select id="selSheet"></select></div>
      <div class="row">제목 행 <select id="selHead"></select></div>
      <div class="row">시설명 <select id="selName"></select></div>
      <div class="row">주소 <select id="selAddr"></select></div>
      <div class="row">심도(m) <select id="selDepth"></select></div>
      <div class="row">위치 구분 <select id="selLoc"></select></div>
      <div class="row" style="font-weight:600;font-size:12px;color:#6b7280">위치 구분이 없을 때 판정 기준 <select id="selDefLoc"><option>차도</option><option>보도</option><option>이면도로</option><option>기타</option></select></div>
      <div class="row">위도 <select id="selLat"></select></div>
      <div class="row">경도 <select id="selLng"></select></div>
      <div style="font-size:12px;font-weight:800;color:var(--sub);margin-top:10px">미리보기</div>
      <div style="overflow-x:auto"><table id="impPrev"></table></div>
    </div>
    <div id="impProg"></div>
    <div class="btns">
      <button type="button" class="b-sec" id="impClose">닫기</button>
      <button type="button" class="b-pri" id="impPick"><i class="fa-solid fa-folder-open"></i> 엑셀 선택</button>
      <button type="button" class="b-pri" id="impGo" style="display:none">불러오기</button>
    </div>
    <div class="btns"><button type="button" class="b-del" id="impClear" style="display:none">시설 목록 삭제</button></div>
  </div>
</div>

<script src="./lib/leaflet/leaflet.js"></script>
<script>
// 카카오 REST 키 (index.html과 동일 — 카카오 콘솔에서 허용 도메인 제한 권장)
const KAKAO_API_KEY='eaa5300f4046bfac8ce0355b1bd8cd88';
const REC_KEY='depth_records_v35';
const LAST_Q_KEY='facility_last_query';

const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity='0',2000); }

// ── 지도 ──
const map=L.map('map',{zoomControl:false,maxZoom:21}).setView([35.84,128.54],13);
L.control.zoom({position:'bottomleft'}).addTo(map);
const layers={
  map:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxNativeZoom:19,maxZoom:21,attribution:'© OpenStreetMap'}),
  sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Esri'})
};
let curLayer='map';
function setLayer(n){
  Object.values(layers).forEach(l=>map.removeLayer(l)); layers[n].addTo(map); curLayer=n;
  document.querySelectorAll('[data-layer]').forEach(b=>b.classList.toggle('on',b.dataset.layer===n));
}
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>setLayer(b.dataset.layer));
setLayer('map');
const resultLayer=L.layerGroup().addTo(map);
let myLoc=null, myMarker=null;

// ── 내 위치 ──
function locate(fly){
  if(!navigator.geolocation){ toast('위치 기능을 쓸 수 없습니다'); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    myLoc={lat:p.coords.latitude,lng:p.coords.longitude};
    if(myMarker) map.removeLayer(myMarker);
    myMarker=L.circleMarker([myLoc.lat,myLoc.lng],{radius:7,color:'#fff',weight:2.5,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('내 위치');
    if(fly) map.setView([myLoc.lat,myLoc.lng],17);
  },()=>{ if(fly) toast('현재 위치를 가져올 수 없습니다'); },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
$('myLocBtn').onclick=()=>locate(true);

// ── 내 측정 기록에서 찾기: 관리번호·주소 일치, 시설별로 묶음 ──
function searchMine(q){
  let recs=[]; try{ recs=JSON.parse(localStorage.getItem(REC_KEY)||'[]'); }catch(e){}
  const k=q.replace(/\s+/g,'').toLowerCase();
  const groups=new Map();
  recs.forEach((r,i)=>{
    const lat=parseFloat(r.latitude), lng=parseFloat(r.longitude);
    if(isNaN(lat)||isNaN(lng)) return;
    const mn=(r.manageNo||'').trim(), ad=(r.address||'').trim();
    const hay=(mn+' '+ad).replace(/\s+/g,'').toLowerCase();
    if(!hay.includes(k)) return;
    const key=mn||ad;
    if(!groups.has(key)) groups.set(key,{name:mn||'(관리번호 없음)',address:ad,points:[]});
    groups.get(key).points.push({lat,lng,no:i+1,depth:r.depth,judge:r.judge,loc:r.loc,locCat:r.locCat,time:r.time});
  });
  return [...groups.values()].map(g=>{
    const lat=g.points.reduce((a,p)=>a+p.lat,0)/g.points.length, lng=g.points.reduce((a,p)=>a+p.lng,0)/g.points.length;
    return {src:'mine',name:g.name,address:g.address,lat,lng,points:g.points};
  });
}

// ── 심도 판정 (메인 화면 설정의 판정 기준을 그대로 사용) ──
// 녹색 = 적합(양호), 빨강 = 미달, 노랑 = 주의(설정에서 켠 경우), 회색 = 판정 불가
const JC={'적합':'#16a34a','주의':'#eab308','미달':'#dc2626','':'#9ca3af'};
function judgeCfg(){
  let c={}; try{ c=JSON.parse(localStorage.getItem('depth_judge_cfg')||'{}'); }catch(e){}
  return {limits:Object.assign({'차도':0.8},c.limits||{}),caution:Number(c.caution||0),ref:c.ref||'top',od:Number(c.od||0)};
}
// 엑셀 시설은 위치 구분이 없으므로 '차도' 기준으로 판정
function judgeOf(depth,loc){
  const c=judgeCfg(), lim=c.limits[loc||'차도'], d=parseFloat(depth);
  if(lim===undefined||lim===''||lim===null||isNaN(Number(lim))||isNaN(d)) return '';
  const eff=d-(c.ref==='center'&&c.od>0?c.od/2000:0);
  if(eff<=Number(lim)+1e-9) return '미달';
  if(c.caution>0&&eff<=Number(lim)+c.caution+1e-9) return '주의';
  return '적합';
}
function pointJudge(p){ return p.judge||judgeOf(p.depth,p.locCat||p.loc); }
function groupJudge(r){
  if(r.src==='fac') return judgeOf(r.depth,r.locCat||'차도');
  if(r.src==='mine'){ const js=r.points.map(pointJudge); return js.includes('미달')?'미달':js.includes('주의')?'주의':js.includes('적합')?'적합':''; }
  return '';
}

const fmtD=d=>(d==null||isNaN(Number(d)))?'':Number(d).toFixed(2)+'m';
function depthText(r){
  if(r.src==='fac') return fmtD(r.depth);
  if(r.src==='mine'){
    const ds=r.points.map(p=>Number(p.depth)).filter(x=>!isNaN(x)); if(!ds.length) return '';
    const mn=Math.min(...ds), mx=Math.max(...ds);
    return mn===mx?fmtD(mn):`${mn.toFixed(2)}~${mx.toFixed(2)}m`;
  }
  return '';
}

// ── 엑셀에서 불러온 시설 목록 ──
const FAC_KEY='facility_list_v1';
function loadFacs(){ try{ return JSON.parse(localStorage.getItem(FAC_KEY)||'null'); }catch(e){ return null; } }
function facItems(){ const f=loadFacs(); return f&&Array.isArray(f.items)?f.items:[]; }
function updFacCnt(){ $('facCnt').textContent=facItems().length; }
function facToResult(f){ return {src:'fac',name:f.name,address:f.addr,lat:f.lat,lng:f.lng,extra:f.extra,depth:f.depth,locCat:f.locCat||loadFacs()?.defLoc||'차도',loc:f.loc}; }
function searchFacs(q){
  const k=q.replace(/\s+/g,'').toLowerCase();
  return facItems().filter(f=>((f.name||'')+' '+(f.addr||'')+' '+(f.extra||'')).replace(/\s+/g,'').toLowerCase().includes(k))
    .slice(0,300).map(facToResult);
}

// ── 카카오 장소 검색 ──
async function searchKakao(q){
  const c=myLoc||map.getCenter();
  const url=`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=15&x=${c.lng}&y=${c.lat}`;
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(url,{headers:{Authorization:`KakaoAK ${KAKAO_API_KEY}`},signal:ctl.signal});
    if(!r.ok) throw new Error(r.status===401||r.status===403?'카카오 API 인증 오류':`카카오 검색 오류 (${r.status})`);
    const d=await r.json();
    return (d.documents||[]).map(x=>({src:'kakao',name:x.place_name,address:x.road_address_name||x.address_name,
      lat:parseFloat(x.y),lng:parseFloat(x.x),category:(x.category_name||'').split('>').pop().trim(),dist:x.distance?Number(x.distance):null}));
  }finally{ clearTimeout(t); }
}

// ── 결과 표시 ──
let results=[];
/* ── 경로 점검 (튄 지점 판정) — index.html·facility.html 공용 ──
 * 튄 지점: 앞뒤 지점을 잇는 선에서 기준 이상 벗어났고, 그 점을 빼면 앞뒤 흐름이 곧게 이어지는 경우.
 * 실제로 길이 꺾이는 모퉁이(ㄱ자)는 앞뒤 흐름이 달라서 제외됨.
 */
function rcXY(p,o){ const k=Math.cos(o.lat*Math.PI/180); return {x:(p.lng-o.lng)*111320*k, y:(p.lat-o.lat)*111320}; }
function rcDist(a,b){ const o=rcXY(b,a); return Math.hypot(o.x,o.y); }
function rcAng(a,b,c,d){ const u=rcXY(b,a), v=rcXY(d,c); const cos=(u.x*v.x+u.y*v.y)/((Math.hypot(u.x,u.y)*Math.hypot(v.x,v.y))||1); return Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI; }
function rcDev(prev,p,next){ const a=rcXY(prev,p), c=rcXY(next,p); const L=Math.hypot(c.x-a.x,c.y-a.y); return L>0?Math.abs(a.x*c.y-a.y*c.x)/L:Math.hypot(a.x,a.y); }
function findSpikes(pts,devMin){
  const out=[];
  if(!(devMin>0)) return out;
  for(let i=1;i<pts.length-1;i++){
    const prev=pts[i-1],p=pts[i],next=pts[i+1];
    const dev=rcDev(prev,p,next); if(dev<devMin) continue;
    if(rcAng(prev,p,p,next)<35) continue;
    const inOk = i<2 || rcAng(pts[i-2],prev,prev,next)<=35;
    const outOk= i>pts.length-3 || rcAng(prev,next,next,pts[i+2])<=35;
    if(inOk&&outOk) out.push({i,dev:Math.round(dev*10)/10});
  }
  return out;
}
// 같은 경로로 이어지는 구간으로 나눔 (간격 maxGap 넘으면 끊음)
function splitRuns(pts,maxGap){
  const runs=[]; let cur=[];
  pts.forEach(p=>{ if(cur.length && rcDist(cur[cur.length-1],p)>maxGap){ runs.push(cur); cur=[]; } cur.push(p); });
  if(cur.length) runs.push(cur);
  return runs;
}

const SPIKE_MIN=(()=>{ const v=localStorage.getItem('depth_spike_m'); return v===null?4:Number(v); })();
const ROUTE_GAP=100; // 이보다 멀면 다른 구간으로 보고 선을 끊음
// 경로 선 + 튄 지점 표시. 측정 기록은 같은 관리번호·같은 날, 엑셀 시설은 같은 이름이 연속된 것을 한 경로로 봄
let spikeRings=[];
function drawRoutes(){
  const routes=[]; spikeRings=[];
  results.forEach((r,i)=>{
    if(r.src!=='mine') return;
    const byDay=new Map();
    r.points.forEach(p=>{ const d=String(p.time||'').slice(0,13); if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(p); });
    byDay.forEach(ps=>routes.push({pts:ps.sort((a,b)=>a.no-b.no), owner:i}));
  });
  let cur=null;
  results.forEach((r,i)=>{
    if(r.src!=='fac'||r.lat==null){ cur=null; return; }
    if(cur && cur.name===r.name){ cur.pts.push({lat:r.lat,lng:r.lng,idx:i}); }
    else { cur={name:r.name,pts:[{lat:r.lat,lng:r.lng,idx:i}]}; routes.push(cur); }
  });
  routes.forEach(rt=>{
    splitRuns(rt.pts,ROUTE_GAP).forEach(run=>{
      if(run.length<2) return;
      L.polyline(run.map(p=>[p.lat,p.lng]),{color:'#1e3a8a',weight:3,opacity:.55,dashArray:'6 6',interactive:false}).addTo(resultLayer);
      findSpikes(run,SPIKE_MIN).forEach(sp=>{
        const p=run[sp.i];
        spikeRings.push(L.circleMarker([p.lat,p.lng],{radius:14,color:'#f97316',weight:3,fill:false,dashArray:'3 3'})
          .bindTooltip(`튐 의심 · 경로에서 ${sp.dev}m`,{direction:'right'}));
        if(p.idx!=null) results[p.idx].spike=sp.dev;
        else if(rt.owner!=null) results[rt.owner].spikes=(results[rt.owner].spikes||0)+1;
      });
    });
  });
}

// 점 크기를 지도 확대 정도에 맞춤 (멀리서 보면 작게 → 경로선·튐 표시가 가려지지 않음)
const dotR=(base)=>{ const z=map.getZoom(); return z>=19?base:z>=18?base-1:z>=17?base-2:z>=16?base-3:Math.max(3,base-4); };
map.on('zoomend',()=>resultLayer.eachLayer(l=>{ if(l.options._base) l.setRadius(dotR(l.options._base)); }));

let allMode=false;
function render(){
  resultLayer.clearLayers();
  results.forEach(r=>{ delete r.spike; delete r.spikes; });
  drawRoutes();
  $('cnt').textContent=results.length;
  if(!results.length){ $('list').innerHTML='<div class="empty">검색 결과가 없습니다.<br>시설명을 줄이거나 다른 이름으로 찾아보세요.</div>'; return; }
  const bounds=[];
  results.forEach((r,i)=>{
    if(r.src==='mine'){
      r.points.forEach(p=>{
        const pj=pointJudge(p);
        L.circleMarker([p.lat,p.lng],{_base:8,radius:dotR(8),color:'#fff',weight:1.5,fillColor:JC[pj],fillOpacity:1})
          .bindTooltip(`No.${p.no} · ${Number(p.depth).toFixed(2)}m${pj?' · '+pj:''}`).on('click',()=>select(i,false)).addTo(resultLayer);
        bounds.push([p.lat,p.lng]);
      });
      L.marker([r.lat,r.lng],{opacity:0}).bindTooltip(esc(r.name)+(depthText(r)?` <span style="color:${JC[groupJudge(r)]==='#9ca3af'?'#2563eb':JC[groupJudge(r)]}">${depthText(r)}</span>`:''),{permanent:!allMode,direction:'top',className:'lbl lbl-'+(groupJudge(r)||'none'),offset:[0,-6]}).on('click',()=>select(i,false)).addTo(resultLayer);
    }else if(r.src==='fac'){
      if(r.lat==null) return; // 좌표 없음
      L.circleMarker([r.lat,r.lng],{_base:9,radius:dotR(9),color:'#fff',weight:1.5,fillColor:JC[groupJudge(r)],fillOpacity:1})
        .bindTooltip(esc(r.name)+(depthText(r)?` <span style="color:${JC[groupJudge(r)]==='#9ca3af'?'#2563eb':JC[groupJudge(r)]}">${depthText(r)}</span>`:''),{permanent:!allMode&&i<15,direction:'top',className:'lbl lbl-'+(groupJudge(r)||'none'),offset:[0,-8]}).on('click',()=>select(i,false)).addTo(resultLayer);
      bounds.push([r.lat,r.lng]);
    }else{
      L.circleMarker([r.lat,r.lng],{radius:8,color:'#fff',weight:2,fillColor:'#7c3aed',fillOpacity:1})
        .bindTooltip(esc(r.name),{permanent:i<5,direction:'top',className:'lbl kakao',offset:[0,-8]}).on('click',()=>select(i,false)).addTo(resultLayer);
      bounds.push([r.lat,r.lng]);
    }
  });
  let html='', lastSrc='';
  results.forEach((r,i)=>{
    if(r.src!==lastSrc){ html+=`<div class="grp">${{fac:'시설 목록',mine:'내 측정 기록',kakao:'카카오 장소'}[r.src]}</div>`; lastSrc=r.src; }
    const spk = r.spike?`<span style="color:#ea580c;font-weight:800">튐 의심 ${r.spike}m</span>`:r.spikes?`<span style="color:#ea580c;font-weight:800">튐 의심 ${r.spikes}곳</span>`:'';
    const meta = r.src==='fac' ? [spk, ...[r.lat==null?'⚠ 위치 없음':'', (r.loc||r.locCat)?`${r.loc||r.locCat} 기준`:'', r.extra].filter(Boolean).map(esc)].filter(Boolean).join(' · ')
      : r.src==='mine'
      ? `측정 ${r.points.length}지점 · 최근 ${esc((r.points[r.points.length-1].time||'').split(' 오')[0])}`+(spk?' · '+spk:'')
      : [r.category, r.dist!=null?(r.dist>=1000?(r.dist/1000).toFixed(1)+'km':r.dist+'m'):''].filter(Boolean).map(esc).join(' · ');
    html+=`<button type="button" class="item" data-i="${i}">
      <span class="badge ${{fac:'b-fac',mine:'b-mine',kakao:'b-kakao'}[r.src]}">${{fac:'시설',mine:'기록',kakao:'장소'}[r.src]}</span>
      <span style="flex:1;min-width:0"><div class="nm">${esc(r.name)}</div><div class="ad">${esc(r.address||'')}</div>${meta?`<div class="meta">${meta}</div>`:''}</span>
      ${depthText(r)?`<span class="dep" style="color:${groupJudge(r)?JC[groupJudge(r)]:'#2563eb'}">${depthText(r)}${groupJudge(r)?`<small>${groupJudge(r)}</small>`:''}</span>`:''}
    </button>`;
  });
  $('list').innerHTML=html;
  spikeRings.forEach(r=>r.addTo(resultLayer));
  if(allMode){
    const js=results.map(groupJudge);
    const n=k=>js.filter(x=>x===k).length;
    html=`<div class="grp" style="font-size:12px;color:#374151">전체 표시 · <span style="color:#16a34a">적합 ${n('적합')}</span> · <span style="color:#dc2626">미달 ${n('미달')}</span>${n('주의')?` · <span style="color:#ca8a04">주의 ${n('주의')}</span>`:''}${n('')?` · <span style="color:#9ca3af">판정없음 ${n('')}</span>`:''}</div>`+html;
    $('list').innerHTML=html;
  }
  if(results.length===1 && results[0].lat!=null) select(0,true);
  else if(bounds.length) map.fitBounds(bounds,{padding:[40,40],maxZoom:17});
}
function select(i,zoom){
  const r=results[i]; if(!r) return;
  if(r.lat==null){ toast('이 시설은 위치(주소·좌표)가 없습니다'); return; }
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',Number(e.dataset.i)===i));
  if(r.src==='mine' && r.points.length>1) map.fitBounds(r.points.map(p=>[p.lat,p.lng]),{padding:[50,50],maxZoom:19});
  else map.setView([r.lat,r.lng],zoom===false?Math.max(map.getZoom(),17):18);
  const el=document.querySelector(`.item[data-i="${i}"]`); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
$('list').addEventListener('click',e=>{ const b=e.target.closest('.item'); if(b) select(Number(b.dataset.i),true); });
$('panelHead').onclick=()=>{ $('panel').classList.toggle('collapsed'); setTimeout(()=>map.invalidateSize(),50); };

async function doSearch(q){
  q=(q||'').trim();
  if(!q){ toast('시설명을 입력하세요'); return; }
  try{ localStorage.setItem(LAST_Q_KEY,q); }catch(e){}
  $('q').blur();
  $('list').innerHTML='<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> 찾는 중...</div>';
  $('panel').classList.remove('collapsed');
  const fac=$('useFac').checked?searchFacs(q):[];
  const mine=$('useMine').checked?searchMine(q):[];
  let kakao=[];
  if($('useKakao').checked){
    try{ kakao=await searchKakao(q); }
    catch(e){ toast(e.name==='AbortError'||e instanceof TypeError?'카카오 검색 실패 (인터넷 연결 확인)':e.message); }
  }
  results=[...fac,...mine,...kakao];
  allMode=false;
  render();
  setTimeout(()=>map.invalidateSize(),50);
}
$('searchForm').onsubmit=e=>{ e.preventDefault(); doSearch($('q').value); };

const norm=v=>String(v==null?'':v).trim();
const GUESS={
  name:/시설명|시설|국사명|국사|명칭|이름|관리번호|설비명|장소명|name/i,
  addr:/도로명|주소|소재지|지번|addr|^위치$/i,
  depth:/심도|깊이|토피|매설|depth/i,
  loc:/위치\s*구분|도로\s*구분|구간\s*구분|노면|^구분$/i,
  lat:/위도|lat/i,
  lng:/경도|lng|lon/i
};
function headerRowGuess(rows){
  let best=0,score=-1;
  for(let r=0;r<Math.min(rows.length,15);r++){
    const cells=rows[r].map(norm).filter(Boolean);
    const sc=cells.filter(c=>Object.values(GUESS).some(g=>g.test(c))).length*10 + cells.filter(c=>isNaN(Number(c))).length;
    if(sc>score){ score=sc; best=r; }
  }
  return best;
}
function fillSelect(sel,heads,guessRe,allowNone){
  sel.innerHTML=(allowNone?'<option value="-1">(없음)</option>':'')+heads.map((h,i)=>`<option value="${i}">${esc(h||('열 '+(i+1)))}</option>`).join('');
  let g=heads.findIndex(h=>guessRe.test(h));
  if(guessRe===GUESS.addr){ const road=heads.findIndex(h=>/도로명/.test(h)); if(road>=0) g=road; }
  sel.value=String(g>=0?g:(allowNone?-1:0));
}
function inKorea(lat,lng){ return lat>32.5&&lat<39&&lng>124&&lng<132.5; }
function guessCoordCols(heads,rows,hr){
  // 제목이 위도/경도가 아니어도 숫자 범위로 찾음
  const sample=rows.slice(hr+1,hr+30);
  const isLat=i=>sample.filter(r=>{const v=parseFloat(r[i]);return v>32.5&&v<39;}).length>=Math.max(1,sample.length*0.6);
  const isLng=i=>sample.filter(r=>{const v=parseFloat(r[i]);return v>124&&v<132.5;}).length>=Math.max(1,sample.length*0.6);
  if($('selLat').value==='-1'){ const i=heads.findIndex((h,i)=>isLat(i)); if(i>=0) $('selLat').value=String(i); }
  if($('selLng').value==='-1'){ const i=heads.findIndex((h,i)=>isLng(i)); if(i>=0) $('selLng').value=String(i); }
}
function readSheet(){
  const ws=wbk.Sheets[$('selSheet').value];
  sheetRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}).filter(r=>r.some(c=>norm(c)!==''));
  const hr=headerRowGuess(sheetRows);
  $('selHead').innerHTML=sheetRows.slice(0,15).map((r,i)=>`<option value="${i}">${i+1}행: ${esc(r.map(norm).filter(Boolean).slice(0,3).join(', ').slice(0,28))}</option>`).join('');
  $('selHead').value=String(hr);
  applyHead();
}
function applyHead(){
  const hr=Number($('selHead').value);
  const heads=(sheetRows[hr]||[]).map(norm);
  fillSelect($('selName'),heads,GUESS.name,false);
  fillSelect($('selAddr'),heads,GUESS.addr,true);
  fillSelect($('selDepth'),heads,GUESS.depth,true);
  fillSelect($('selLoc'),heads,GUESS.loc,true);
  fillSelect($('selLat'),heads,GUESS.lat,true);
  fillSelect($('selLng'),heads,GUESS.lng,true);
  guessCoordCols(heads,sheetRows,hr);
  preview();
}
function preview(){
  const hr=Number($('selHead').value);
  const cols=[['시설명','selName'],['주소','selAddr'],['심도','selDepth'],['위치','selLoc'],['위도','selLat'],['경도','selLng']].filter(([,id])=>$(id).value!=='-1');
  const rows=sheetRows.slice(hr+1).filter(r=>norm(r[Number($('selName').value)]));
  $('impPrev').innerHTML='<tr>'+cols.map(([h])=>`<th>${h}</th>`).join('')+'</tr>'+
    rows.slice(0,4).map(r=>'<tr>'+cols.map(([,id])=>`<td>${esc(norm(r[Number($(id).value)]))}</td>`).join('')+'</tr>').join('');
  $('impFileInfo').innerHTML=`시설 <b>${rows.length}건</b>을 찾았습니다. 열이 맞는지 확인하세요.`;
  $('impGo').disabled=!rows.length;
}
['selName','selAddr','selDepth','selLoc','selLat','selLng'].forEach(id=>$(id).onchange=preview);

async function geocode(addr){
  const call=async(kind)=>{
    const r=await fetch(`https://dapi.kakao.com/v2/local/search/${kind}.json?query=${encodeURIComponent(addr)}&size=1`,{headers:{Authorization:`KakaoAK ${KAKAO_API_KEY}`}});
    if(!r.ok) throw new Error('kakao '+r.status);
    const d=await r.json(); const x=(d.documents||[])[0];
    return x?{lat:parseFloat(x.y),lng:parseFloat(x.x)}:null;
  };
  return (await call('address')) || (await call('keyword'));
}

$('impGo').onclick=async()=>{
  const hr=Number($('selHead').value);
  const ci={name:+$('selName').value,addr:+$('selAddr').value,depth:+$('selDepth').value,loc:+$('selLoc').value,lat:+$('selLat').value,lng:+$('selLng').value};
  const defLoc=$('selDefLoc').value;
  // 엑셀의 위치 구분 글자 → 앱의 판정 구분
  const locOf=v=>{ v=norm(v); if(!v) return ''; if(/보도|인도/.test(v)) return '보도'; if(/이면/.test(v)) return '이면도로'; if(/차도|도로|차로/.test(v)) return '차도'; return '기타'; };
  const heads=(sheetRows[hr]||[]).map(norm);
  const used=new Set(Object.values(ci));
  const extraCols=heads.map((h,i)=>i).filter(i=>!used.has(i)&&heads[i]&&!/^(번호|순번|no\.?|연번|#)$/i.test(heads[i])).slice(0,3);
  const items=sheetRows.slice(hr+1).map(r=>{
    const name=norm(r[ci.name]); if(!name) return null;
    let lat=ci.lat>=0?parseFloat(r[ci.lat]):NaN, lng=ci.lng>=0?parseFloat(r[ci.lng]):NaN;
    if(!isNaN(lat)&&!isNaN(lng)&&!inKorea(lat,lng)&&inKorea(lng,lat)){ const t=lat; lat=lng; lng=t; } // 위도·경도 뒤바뀜
    const ok=!isNaN(lat)&&!isNaN(lng)&&inKorea(lat,lng);
    const dv=ci.depth>=0?parseFloat(String(r[ci.depth]).replace(/[^0-9.\-]/g,'')):NaN;
    const lt=ci.loc>=0?norm(r[ci.loc]):'';
    return {name, addr:ci.addr>=0?norm(r[ci.addr]):'', depth:isNaN(dv)?null:dv, loc:lt, locCat:locOf(lt)||defLoc, lat:ok?lat:null, lng:ok?lng:null,
      extra:extraCols.map(i=>norm(r[i])).filter(Boolean).join(' / ').slice(0,60)};
  }).filter(Boolean);
  if(facItems().length && !confirm(`기존 시설 목록 ${facItems().length}건을 새 목록 ${items.length}건으로 바꿀까요?`)) return;
  $('impGo').disabled=true; $('impClose').disabled=true;
  // 좌표 없는 시설: 주소로 위치 찾기 (같은 주소는 한 번만)
  const need=items.filter(f=>f.lat==null&&f.addr);
  const cache=new Map(); let done=0, fail=0, stop=false;
  const work=async()=>{ while(need.length&&!stop){ const f=need.shift();
      try{ if(!cache.has(f.addr)) cache.set(f.addr,await geocode(f.addr)); const g=cache.get(f.addr); if(g){ f.lat=g.lat; f.lng=g.lng; } else fail++; }
      catch(e){ fail++; if(String(e.message).includes('401')||String(e.message).includes('403')) stop=true; }
      done++; $('impProg').textContent=`주소로 위치 찾는 중... ${done} / ${done+need.length}`; } };
  const total=need.length;
  if(total){ $('impProg').textContent=`주소로 위치 찾는 중... 0 / ${total}`; await Promise.all([work(),work(),work(),work()]); }
  const noLoc=items.filter(f=>f.lat==null).length;
  const d=new Date();
  localStorage.setItem(FAC_KEY,JSON.stringify({defLoc,file:$('impFile')._name||'',date:`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,items}));
  updFacCnt(); impInfo(); autoBackupNow(); showAll();
  $('impGo').disabled=false; $('impClose').disabled=false;
  $('impProg').innerHTML=`<span style="color:#16a34a">시설 ${items.length}건을 불러왔습니다.</span>`+(noLoc?`<br><span style="color:#dc2626">위치를 찾지 못한 시설 ${noLoc}건 (주소 확인 필요)</span>`:'');
  $('impMap').style.display='none'; $('impGo').style.display='none'; $('impPick').style.display='';
  toast(`시설 ${items.length}건 불러오기 완료`);
};
updFacCnt();

// 뒤로: 앱 메인 화면으로
$('backBtn').onclick=()=>{ if(history.length>1) history.back(); else location.href='./'; };

// 주소에 ?q=시설명 이 있으면 바로 검색, 없으면 마지막 검색어 채움
// 처음 열 때(검색 전): 불러온 시설 전체 + 내 측정 기록 전체를 판정 색으로 표시
function showAll(){
  const fac=facItems().map(facToResult);
  const mine=searchMine('');
  results=[...fac,...mine];
  allMode=true;
  if(!results.length){ resultLayer.clearLayers(); $('cnt').textContent=0;
    $('list').innerHTML='<div class="empty">시설명을 입력하고 검색하세요.<br>오른쪽 위 [시설 목록]에서 엑셀로 시설을 불러올 수 있습니다.</div>'; return; }
  render();
  $('panel').classList.add('collapsed'); setTimeout(()=>map.invalidateSize(),50);
}
// 검색어를 지우면 다시 전체 보기
$('q').addEventListener('input',()=>{ if(!$('q').value.trim()&&!allMode) showAll(); });

// 시설 목록이 바뀌면 자동 백업 (APK)
function autoBackupNow(){
  if(!(window.SimdoAndroid&&SimdoAndroid.autoBackup)) return;
  try{ let fac=null; try{ fac=JSON.parse(localStorage.getItem('facility_list_v1')||'null'); }catch(e){}
    SimdoAndroid.autoBackup(JSON.stringify({version:'',user:localStorage.getItem('depth_user_name')||'',judge:localStorage.getItem('depth_judge_cfg')||'',facilities:fac,records:JSON.parse(localStorage.getItem(REC_KEY)||'[]')}));
  }catch(e){}
}

const qp=new URLSearchParams(location.search).get('q');
locate(false);
if(qp){ $('q').value=qp; doSearch(qp); }
else { showAll(); }
</script>
</body>
</html>
